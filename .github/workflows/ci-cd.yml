name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ---------------- CI: build + test ----------------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/site/jacoco

  # ---------------- Build image, scan, push ----------------
  docker:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  # ---------------- CD: deploy to minikube ----------------
  # Runs on a self-hosted runner on the machine where minikube runs.
  # Enable it by creating a repository variable ENABLE_DEPLOY = true.
  deploy:
    needs: docker
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Point manifests at the new image
        run: sed -i "s|ghcr.io/OWNER/url-shortener:latest|${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres --timeout=180s
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/url-shortener --timeout=240s

      - name: Smoke test
        run: |
          kubectl port-forward svc/url-shortener 8081:80 &
          PF_PID=$!
          sleep 5
          curl -fsS http://localhost:8081/actuator/health
          CODE=$(curl -fsS -X POST http://localhost:8081/api/shorten \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}' | sed -E 's/.*"code":"([^"]+)".*/\1/')
          echo "Short code: $CODE"
          curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}\n' http://localhost:8081/$CODE
          kill $PF_PID
